# A self-contained BRIDGE environment: Python, the Python packages AND every
# binary the arms call. Use it where no module system provides the tools:
#
#     conda env create -f environment.yml        # or: micromamba create -f environment.yml
#     conda activate bridge
#     bridge check
#
# then set `tools: tools_env: null` in config.yaml so the PBS jobs do not try
# to load modules. Tool versions are the ones BRIDGE was validated with; if
# your channels cannot resolve an exact pin, relax it to `>=`.
name: bridge
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - pandas>=2.0
  - numpy>=1.24
  - matplotlib>=3.7
  - seaborn>=0.13
  - pyyaml>=6
  - pytest>=8
  - kallisto=0.52.0
  - mash=2.3
  - minimap2=2.31
  - bwa-mem2=2.2.1
  - samtools=1.23.1
  - blast=2.11.0
  - viral_consensus=1.0.1
  - cliquesnv=2.0.3
  - kma=1.6.6
  - openjdk>=11
  - pip
  - pip:
      - -e .
